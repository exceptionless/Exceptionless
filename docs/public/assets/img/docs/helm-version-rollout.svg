<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Safe Helm version rollout versus infrastructure migration</title>
  <desc id="desc">The safe rolling path keeps the current chart's explicit role selectors and exact effective connection strings unchanged, upgrades only the application images, verifies mixed replicas use the same backends, and completes the rollout. Changing a selector, provider, or endpoint is a separate migration requiring a bridge or dual-read-write process, or quiescing and draining work before switching all replicas.</desc>
  <defs>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
    <style>
      .heading { font: 700 25px system-ui, sans-serif; fill: #0f172a; }
      .section { font: 700 18px system-ui, sans-serif; }
      .label { font: 650 16px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 14px system-ui, sans-serif; fill: #475569; }
      .safe { fill: #ecfdf5; stroke: #0f766e; stroke-width: 2.25; rx: 10; }
      .migration { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.25; rx: 10; }
      .safeArrow { fill: none; stroke: #0f766e; stroke-width: 2.5; marker-end: url(#greenArrow); }
      .redArrow { fill: none; stroke: #b91c1c; stroke-width: 2.5; marker-end: url(#redArrow); }
    </style>
  </defs>
  <rect width="1200" height="540" fill="#f8fafc" rx="16"/>
  <text x="40" y="44" class="heading">Keep a version rollout separate from a backend migration</text>
  <rect x="855" y="20" width="305" height="36" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5" rx="9"/>
  <text x="1007.5" y="43" text-anchor="middle" class="small">Current chart: explicit legacy role selectors</text>

  <text x="40" y="95" class="section" fill="#065f46">Rolling image upgrade</text>
  <rect x="40" y="115" width="245" height="94" class="safe"/>
  <text x="162.5" y="145" text-anchor="middle" class="label">Preflight</text>
  <text x="162.5" y="170" text-anchor="middle" class="small">same role selectors and</text>
  <text x="162.5" y="191" text-anchor="middle" class="small">exact effective endpoints</text>

  <rect x="340" y="115" width="225" height="94" class="safe"/>
  <text x="452.5" y="145" text-anchor="middle" class="label">Upgrade images only</text>
  <text x="452.5" y="170" text-anchor="middle" class="small">old and new replicas</text>
  <text x="452.5" y="191" text-anchor="middle" class="small">overlap normally</text>

  <rect x="620" y="115" width="245" height="94" class="safe"/>
  <text x="742.5" y="145" text-anchor="middle" class="label">Verify overlap</text>
  <text x="742.5" y="170" text-anchor="middle" class="small">every replica uses the</text>
  <text x="742.5" y="191" text-anchor="middle" class="small">same providers and endpoints</text>

  <rect x="920" y="115" width="240" height="94" class="safe"/>
  <text x="1040" y="145" text-anchor="middle" class="label">Complete rollout</text>
  <text x="1040" y="170" text-anchor="middle" class="small">selectors remain in place</text>
  <text x="1040" y="191" text-anchor="middle" class="small">until a separate decision</text>

  <path d="M285 162 H340" class="safeArrow"/>
  <path d="M565 162 H620" class="safeArrow"/>
  <path d="M865 162 H920" class="safeArrow"/>

  <line x1="40" y1="248" x2="1160" y2="248" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="290" class="section" fill="#991b1b">Separate infrastructure migration — not a rolling configuration cleanup</text>

  <rect x="40" y="315" width="250" height="98" class="migration"/>
  <text x="165" y="346" text-anchor="middle" class="label">Selector, provider, or</text>
  <text x="165" y="369" text-anchor="middle" class="label">endpoint must change</text>
  <text x="165" y="395" text-anchor="middle" class="small">plan per role and backend</text>

  <rect x="360" y="315" width="300" height="98" class="migration"/>
  <text x="510" y="346" text-anchor="middle" class="label">Bridge or dual read/write</text>
  <text x="510" y="369" text-anchor="middle" class="small">when the provider supports it</text>
  <text x="510" y="395" text-anchor="middle" class="small">otherwise quiesce and drain</text>

  <rect x="730" y="315" width="210" height="98" class="migration"/>
  <text x="835" y="346" text-anchor="middle" class="label">Switch together</text>
  <text x="835" y="369" text-anchor="middle" class="small">move every replica to</text>
  <text x="835" y="395" text-anchor="middle" class="small">the new backend</text>

  <rect x="1010" y="315" width="150" height="98" class="migration"/>
  <text x="1085" y="346" text-anchor="middle" class="label">Verify</text>
  <text x="1085" y="369" text-anchor="middle" class="small">then resume</text>
  <text x="1085" y="395" text-anchor="middle" class="small">traffic</text>

  <path d="M290 364 H360" class="redArrow"/>
  <path d="M660 364 H730" class="redArrow"/>
  <path d="M940 364 H1010" class="redArrow"/>

  <rect x="170" y="457" width="860" height="54" fill="#fff7ed" stroke="#ea580c" stroke-width="1.75" rx="10"/>
  <text x="600" y="479" text-anchor="middle" class="label">Configuration rollback order</text>
  <text x="600" y="500" text-anchor="middle" class="small">Restore the old selector and endpoint → wait for every replica to converge → then roll back the binary.</text>
</svg>
