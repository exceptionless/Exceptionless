# The docs sidebar, previous and next links, breadcrumbs, and llms.txt sections all come from this file.
#
# - section: a top-level sidebar section.
# - A plain URL is a page. The page's navTitle (or title) is its label.
# - group: a collapsible sub-group. Give it a url to link the group heading to its overview page; that page then comes
#   first in the reading order, before the group's items.
#
# deno task verify fails if a URL here has no page, or if a published docs page is missing from this file.
- section: Get started
  items:
    - /docs/
    - /docs/getting-started/
    - /docs/concepts/
    - /docs/whats-new/

