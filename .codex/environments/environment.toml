# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Exceptionless Aspire"

[setup]
script = '''
set -e

worktree_path="${CODEX_WORKTREE_PATH:-$PWD}"
if [ ! -f "$worktree_path/Exceptionless.slnx" ]; then
  worktree_path="$(git rev-parse --show-toplevel 2>/dev/null || true)"
fi

if [ -z "$worktree_path" ] || [ ! -f "$worktree_path/Exceptionless.slnx" ]; then
  echo "Unable to locate the Exceptionless worktree or solution." >&2
  exit 1
fi

cd "$worktree_path"
worktree_path="$PWD"

echo "Setting up Exceptionless Aspire worktree: $worktree_path"

if ! command -v dotnet >/dev/null 2>&1; then
  echo "dotnet is not installed or not on PATH. Exceptionless requires .NET 10." >&2
  exit 1
fi

if ! command -v node >/dev/null 2>&1; then
  echo "node is not installed or not on PATH. Exceptionless requires Node 24+." >&2
  exit 1
fi

if ! command -v npm >/dev/null 2>&1; then
  echo "npm is not installed or not on PATH." >&2
  exit 1
fi

echo "dotnet:"
dotnet --version

echo "node:"
node --version

echo "npm:"
npm --version

echo "Restoring .NET workloads..."
dotnet workload restore

echo "Restoring Exceptionless.slnx..."
dotnet restore Exceptionless.slnx

echo "Installing Svelte frontend dependencies..."
npm ci --prefix src/Exceptionless.Web/ClientApp --prefer-offline --no-audit

echo "Installing legacy Angular frontend dependencies..."
npm ci --prefix src/Exceptionless.Web/ClientApp.angular --prefer-offline --no-audit

echo "Setup complete. Use Run Aspire to start the app, Run Storybook for component work, or Run Lume Docs to test the static site."
'''

[cleanup]
script = '''
set +e

worktree_path="${CODEX_WORKTREE_PATH:-$PWD}"
if [ ! -d "$worktree_path/.git" ] && [ ! -f "$worktree_path/Exceptionless.slnx" ]; then
  worktree_path="$(git rev-parse --show-toplevel 2>/dev/null || true)"
fi

if [ -z "$worktree_path" ] || [ ! -d "$worktree_path" ]; then
  echo "Unable to locate the Exceptionless worktree." >&2
  exit 1
fi

cd "$worktree_path"
worktree_path="$PWD"

echo "Cleaning Exceptionless worktree-local output only: $worktree_path"

echo "Removing repo-local temp/test output only..."

rm -rf .cache/tmp
rm -rf .aspire
rm -rf TestResults
rm -rf docs/_site
rm -rf docs/_cache

find . -type d \( -name TestResults -o -name .vite -o -name .svelte-kit \) -exec rm -rf {} +

echo "Cleanup complete."
echo "Aspire infrastructure containers and Docker volumes were intentionally left alone."
'''

[[actions]]
name = "Run Aspire"
icon = "run"
command = "./.codex/scripts/run-aspire.sh"

[[actions]]
name = "Run Storybook"
icon = "run"
command = "./.codex/scripts/run-storybook.sh"

[[actions]]
name = "Run Lume Docs"
icon = "run"
command = "./.codex/scripts/run-lume-docs.sh"

[[actions]]
name = "Stop Aspire Containers, keep data"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker stop \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true
fi
'''

[[actions]]
name = "Reset Aspire Containers, keep volumes"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker rm -f \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true
fi
'''

[[actions]]
name = "Hard reset Aspire data"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker rm -f \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true

  docker volume rm exceptionless.data.v1 2>/dev/null || true
fi
'''
