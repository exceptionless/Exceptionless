# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Exceptionless Aspire"

[setup]
script = '''
set -e

worktree_path="${CODEX_WORKTREE_PATH:-$PWD}"
if [ ! -f "$worktree_path/Exceptionless.slnx" ]; then
  worktree_path="$(git rev-parse --show-toplevel 2>/dev/null || true)"
fi

if [ -z "$worktree_path" ] || [ ! -f "$worktree_path/Exceptionless.slnx" ]; then
  echo "Unable to locate the Exceptionless worktree or solution." >&2
  exit 1
fi

cd "$worktree_path"
worktree_path="$PWD"

echo "Setting up Exceptionless Aspire worktree: $worktree_path"

if ! command -v dotnet >/dev/null 2>&1; then
  echo "dotnet is not installed or not on PATH. Exceptionless requires .NET 10." >&2
  exit 1
fi

if ! command -v node >/dev/null 2>&1; then
  echo "node is not installed or not on PATH. Exceptionless requires Node 24+." >&2
  exit 1
fi

if ! command -v npm >/dev/null 2>&1; then
  echo "npm is not installed or not on PATH." >&2
  exit 1
fi

echo "dotnet:"
dotnet --version

echo "node:"
node --version

echo "npm:"
npm --version

echo "Restoring .NET workloads..."
dotnet workload restore

echo "Restoring Exceptionless.slnx..."
dotnet restore Exceptionless.slnx

echo "Installing Svelte frontend dependencies..."
npm ci --prefix src/Exceptionless.Web/ClientApp --prefer-offline --no-audit

echo "Installing legacy Angular frontend dependencies..."
npm ci --prefix src/Exceptionless.Web/ClientApp.angular --prefer-offline --no-audit

echo "Setup complete. Use Run Aspire to start the app, Run Storybook for component work, or Run Lume Docs to test the static site."
'''

[cleanup]
script = '''
set +e

worktree_path="${CODEX_WORKTREE_PATH:-$PWD}"
if [ ! -d "$worktree_path/.git" ] && [ ! -f "$worktree_path/Exceptionless.slnx" ]; then
  worktree_path="$(git rev-parse --show-toplevel 2>/dev/null || true)"
fi

if [ -z "$worktree_path" ] || [ ! -d "$worktree_path" ]; then
  echo "Unable to locate the Exceptionless worktree." >&2
  exit 1
fi

cd "$worktree_path"
worktree_path="$PWD"

echo "Cleaning Exceptionless worktree-local output only: $worktree_path"

echo "Removing repo-local temp/test output only..."

rm -rf .cache/tmp
rm -rf .aspire
rm -rf TestResults
rm -rf docs/_site
rm -rf docs/_cache

find . -type d \( -name TestResults -o -name .vite -o -name .svelte-kit \) -exec rm -rf {} +

echo "Cleanup complete."
echo "Aspire infrastructure containers and Docker volumes were intentionally left alone."
'''

[[actions]]
name = "Run Aspire"
icon = "run"
command = '''
set -e

worktree_path="${CODEX_WORKTREE_PATH:-$PWD}"
if [ ! -f "$worktree_path/src/Exceptionless.AppHost/Exceptionless.AppHost.csproj" ]; then
  worktree_path="$(git rev-parse --show-toplevel 2>/dev/null || true)"
fi

if [ -z "$worktree_path" ] || [ ! -f "$worktree_path/src/Exceptionless.AppHost/Exceptionless.AppHost.csproj" ]; then
  echo "Unable to locate the Exceptionless worktree or AppHost project." >&2
  exit 1
fi

cd "$worktree_path"
worktree_path="$PWD"

export AppMode=Development
export DOTNET_ENVIRONMENT=Development
export ASPNETCORE_ENVIRONMENT=Development
export ASPIRE_HOME="$worktree_path/.aspire"

mkdir -p "$ASPIRE_HOME"

echo "Starting Exceptionless Aspire from $worktree_path"
echo "Aspire logs: $ASPIRE_HOME/logs"

if command -v aspire >/dev/null 2>&1; then
  exec aspire run --apphost src/Exceptionless.AppHost --nologo
elif command -v dotnet >/dev/null 2>&1; then
  echo "Aspire CLI not found; starting the AppHost with dotnet."
  exec dotnet run --project src/Exceptionless.AppHost/Exceptionless.AppHost.csproj
fi

echo "Neither the Aspire CLI nor dotnet is installed or available on PATH." >&2
exit 1
'''

[[actions]]
name = "Run Storybook"
icon = "run"
command = '''
set -e

worktree_path="${CODEX_WORKTREE_PATH:-$PWD}"
if [ ! -f "$worktree_path/src/Exceptionless.Web/ClientApp/package.json" ]; then
  worktree_path="$(git rev-parse --show-toplevel 2>/dev/null || true)"
fi

client_path="$worktree_path/src/Exceptionless.Web/ClientApp"
if [ -z "$worktree_path" ] || [ ! -f "$client_path/package.json" ]; then
  echo "Unable to locate the Exceptionless Svelte client." >&2
  exit 1
fi

cd "$client_path"

storybook_bin="./node_modules/.bin/storybook"
storybook_port="${STORYBOOK_PORT:-6006}"
storybook_path="${STORYBOOK_PATH:-/story/components-shared-taglist--clickable-long-tags-in-a-summary-cell}"

if [ ! -x "$storybook_bin" ]; then
  echo "Storybook dependencies are missing. Run setup first." >&2
  exit 1
fi

echo "Starting Storybook at http://127.0.0.1:$storybook_port/?path=$storybook_path"
exec "$storybook_bin" dev --host 127.0.0.1 --port "$storybook_port" --initial-path "$storybook_path" --exact-port
'''

[[actions]]
name = "Run Lume Docs"
icon = "run"
command = '''
set -e

worktree_path="${CODEX_WORKTREE_PATH:-$PWD}"
if [ ! -d "$worktree_path/docs" ]; then
  worktree_path="$(git rev-parse --show-toplevel 2>/dev/null || true)"
fi

if [ -z "$worktree_path" ] || [ ! -d "$worktree_path/docs" ]; then
  echo "Unable to locate the Exceptionless docs directory." >&2
  exit 1
fi

cd "$worktree_path/docs"

export PORT="${PORT:-7141}"

if ! command -v deno >/dev/null 2>&1; then
  echo "deno is not installed or not on PATH. The Lume docs site requires Deno." >&2
  exit 1
fi

echo "deno:"
deno --version

echo "Starting Lume docs at http://127.0.0.1:$PORT/"
deno task serve
'''

[[actions]]
name = "Stop Aspire Containers, keep data"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker stop \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true
fi
'''

[[actions]]
name = "Reset Aspire Containers, keep volumes"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker rm -f \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true
fi
'''

[[actions]]
name = "Hard reset Aspire data"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker rm -f \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true

  docker volume rm exceptionless.data.v1 2>/dev/null || true
fi
'''
