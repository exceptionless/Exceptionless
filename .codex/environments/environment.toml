# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Exceptionless Aspire"

[setup]
script = '''
set -e

cd "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}"

echo "Setting up Exceptionless Aspire worktree: $CODEX_WORKTREE_PATH"

if ! command -v dotnet >/dev/null 2>&1; then
  echo "dotnet is not installed or not on PATH. Exceptionless requires .NET 10." >&2
  exit 1
fi

if ! command -v node >/dev/null 2>&1; then
  echo "node is not installed or not on PATH. Exceptionless requires Node 24+." >&2
  exit 1
fi

if ! command -v npm >/dev/null 2>&1; then
  echo "npm is not installed or not on PATH." >&2
  exit 1
fi

echo "dotnet:"
dotnet --version

echo "node:"
node --version

echo "npm:"
npm --version

echo "Restoring .NET workloads..."
dotnet workload restore

echo "Restoring Exceptionless.slnx..."
dotnet restore Exceptionless.slnx

echo "Installing Svelte frontend dependencies..."
npm ci --prefix src/Exceptionless.Web/ClientApp --prefer-offline --no-audit

echo "Installing legacy Angular frontend dependencies..."
npm ci --prefix src/Exceptionless.Web/ClientApp.angular --prefer-offline --no-audit

echo "Setup complete. Use Run Site to start and open the local app, Run Aspire for the dashboard, or Run Storybook for component verification."
'''

[cleanup]
script = '''
set +e

cd "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}"

echo "Cleaning Exceptionless worktree-local output only: $CODEX_WORKTREE_PATH"

echo "Removing repo-local temp/test output only..."

rm -rf .cache/tmp
rm -rf .aspire
rm -rf TestResults
rm -rf docs/_site
rm -rf docs/_cache

find . -type d \( -name TestResults -o -name .vite -o -name .svelte-kit \) -exec rm -rf {} +

echo "Cleanup complete."
echo "Aspire infrastructure containers and Docker volumes were intentionally left alone."
'''

[[actions]]
name = "Run Aspire"
icon = "run"
command = '''
set -e

cd "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}"

export AppMode=Development
export DOTNET_ENVIRONMENT=Development
export ASPNETCORE_ENVIRONMENT=Development
export ASPIRE_HOME="$CODEX_WORKTREE_PATH/.aspire"

if command -v aspire >/dev/null 2>&1; then
  mkdir -p "$ASPIRE_HOME"
  aspire_log="$ASPIRE_HOME/logs/environment-aspire.log"

  aspire run --apphost src/Exceptionless.AppHost --nologo --non-interactive >"$aspire_log" 2>&1 &
  aspire_pid=$!

  tail -f "$aspire_log" &
  log_pid=$!

  cleanup() {
    kill "$log_pid" 2>/dev/null || true
    kill "$aspire_pid" 2>/dev/null || true
    wait "$log_pid" 2>/dev/null || true
    wait "$aspire_pid" 2>/dev/null || true
  }
  trap cleanup EXIT INT TERM

  dashboard_url=""
  for attempt in $(seq 1 60); do
    dashboard_url="$(sed -n 's/.*Dashboard: \(https\?:\/\/[^[:space:]]*\).*/\1/p' "$aspire_log" | head -n 1)"
    if [ -n "$dashboard_url" ]; then
      break
    fi

    if ! kill -0 "$aspire_pid" 2>/dev/null; then
      wait "$aspire_pid"
      exit 1
    fi

    sleep 1
  done

  if [ -z "$dashboard_url" ]; then
    echo "Aspire started but did not publish a dashboard URL." >&2
    exit 1
  fi

  echo "Opening Aspire dashboard: $dashboard_url"
  if command -v open >/dev/null 2>&1; then
    open "$dashboard_url"
  else
    echo "Open this URL in a browser: $dashboard_url"
  fi

  wait "$aspire_pid"
else
  dotnet run --project src/Exceptionless.AppHost/Exceptionless.AppHost.csproj --launch-profile https
fi
'''

[[actions]]
name = "Run Site"
icon = "run"
command = '''
set -e

cd "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}"

export AppMode=Development
export DOTNET_ENVIRONMENT=Development
export ASPNETCORE_ENVIRONMENT=Development
export ASPIRE_HOME="$CODEX_WORKTREE_PATH/.aspire"

if ! command -v aspire >/dev/null 2>&1; then
  echo "The Run Site action requires the Aspire CLI. Use Run Aspire to start the local stack." >&2
  exit 1
fi

if ! command -v jq >/dev/null 2>&1; then
  echo "The Run Site action requires jq to discover Aspire's dynamic frontend URL." >&2
  exit 1
fi

mkdir -p "$ASPIRE_HOME"

find_site_url() {
  aspire describe --apphost src/Exceptionless.AppHost --format Json --nologo --non-interactive 2>/dev/null \
    | sed -n '/^{/,$p' \
    | jq -r '.resources[]? | select(.displayName == "App" and .state == "Running") | .urls[]? | select(.displayName == "Open App") | .url' \
    | head -n 1
}

site_url="$(find_site_url || true)"
if [ -n "$site_url" ]; then
  echo "Opening running Exceptionless site: $site_url"
  if command -v open >/dev/null 2>&1; then
    open "$site_url"
  else
    echo "Open this URL in a browser: $site_url"
  fi
  exit 0
fi

aspire_log="$ASPIRE_HOME/logs/environment-site.log"
aspire run --apphost src/Exceptionless.AppHost --nologo --non-interactive >"$aspire_log" 2>&1 &
aspire_pid=$!

tail -f "$aspire_log" &
log_pid=$!

cleanup() {
  kill "$log_pid" 2>/dev/null || true
  kill "$aspire_pid" 2>/dev/null || true
  wait "$log_pid" 2>/dev/null || true
  wait "$aspire_pid" 2>/dev/null || true
}
trap cleanup EXIT INT TERM

site_url=""
for attempt in $(seq 1 60); do
  site_url="$(find_site_url || true)"
  if [ -n "$site_url" ]; then
    break
  fi

  if ! kill -0 "$aspire_pid" 2>/dev/null; then
    wait "$aspire_pid"
    exit 1
  fi

  sleep 1
done

if [ -z "$site_url" ]; then
  echo "Aspire started but did not publish the Exceptionless site URL." >&2
  exit 1
fi

echo "Opening Exceptionless site: $site_url"
if command -v open >/dev/null 2>&1; then
  open "$site_url"
else
  echo "Open this URL in a browser: $site_url"
fi

wait "$aspire_pid"
'''

[[actions]]
name = "Run Storybook"
icon = "run"
command = '''
set -e

cd "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}/src/Exceptionless.Web/ClientApp"

storybook_port="${STORYBOOK_PORT:-6006}"
storybook_path="${STORYBOOK_PATH:-/story/components-shared-taglist--clickable-long-tags}"
storybook_url="http://127.0.0.1:${storybook_port}/?path=${storybook_path}"
storybook_bin="./node_modules/.bin/storybook"

if [ ! -x "$storybook_bin" ]; then
  echo "Storybook dependencies are missing. Run setup first." >&2
  exit 1
fi

"$storybook_bin" dev --host 127.0.0.1 --port "$storybook_port" &
storybook_pid=$!

cleanup() {
  kill "$storybook_pid" 2>/dev/null || true
  wait "$storybook_pid" 2>/dev/null || true
}
trap cleanup EXIT INT TERM

for attempt in $(seq 1 60); do
  if curl -fsS "http://127.0.0.1:${storybook_port}/" >/dev/null 2>&1; then
    break
  fi

  if ! kill -0 "$storybook_pid" 2>/dev/null; then
    wait "$storybook_pid"
    exit 1
  fi

  sleep 1
done

if ! curl -fsS "http://127.0.0.1:${storybook_port}/" >/dev/null 2>&1; then
  echo "Storybook did not become ready at http://127.0.0.1:${storybook_port}/" >&2
  exit 1
fi

echo "Opening Storybook: $storybook_url"
if command -v open >/dev/null 2>&1; then
  open "$storybook_url"
else
  echo "Open this URL in a browser: $storybook_url"
fi

wait "$storybook_pid"
'''

[[actions]]
name = "Run Lume Docs"
icon = "run"
command = '''
set -e

cd "${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is required}/docs"

export PORT="${PORT:-7141}"

if ! command -v deno >/dev/null 2>&1; then
  echo "deno is not installed or not on PATH. The Lume docs site requires Deno." >&2
  exit 1
fi

echo "deno:"
deno --version

echo "Starting Lume docs at http://127.0.0.1:$PORT/"
deno task serve
'''

[[actions]]
name = "Stop Aspire Containers, keep data"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker stop \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true
fi
'''

[[actions]]
name = "Reset Aspire Containers, keep volumes"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker rm -f \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true
fi
'''

[[actions]]
name = "Hard reset Aspire data"
icon = "tool"
command = '''
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
  docker rm -f \
    Exceptionless-Elasticsearch \
    Exceptionless-Kibana \
    Exceptionless-Redis \
    Exceptionless-RedisInsight \
    Redis-insight \
    Exceptionless-Storage \
    Exceptionless-Mail \
    2>/dev/null || true

  docker volume rm exceptionless.data.v1 2>/dev/null || true
fi
'''
