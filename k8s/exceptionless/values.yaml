version: latest

app:
  defaultDomain:
  domains: []
  image:
    repository: exceptionless/app
    pullPolicy: IfNotPresent

api:
  defaultDomain:
  domains: []
  image:
    repository: exceptionless/api
    pullPolicy: IfNotPresent

jobs:
  image:
    repository: exceptionless/job
    pullPolicy: IfNotPresent

config: {}
#  key: value

# Verified, dedicated ingress subnets; configure them in environment values.
# A replacement list prevents stale subnet entries surviving --reuse-values.
forwardedHeaders:
  knownNetworks: []

ingress:
  enabled: false
  clusterIssuer: cert-manager-webhook-dnsimple-production
  albName: public-alb
  albNamespace: kube-system
  appRequestTimeout: 0s

service:
  type: ClusterIP

elasticsearch:
  connectionString:
  image:
    repository: exceptionless/elasticsearch
    tag: 8.19.22
    pullPolicy: IfNotPresent

redis:
  connectionString:
  image:
    repository: redis
    tag: latest
    pullPolicy: IfNotPresent

storage:
  connectionString:
  # Used for the folder storage claim when no connectionString is set. Leave
  # storageClassName empty to use the cluster default. Pods on more than one node
  # need a ReadWriteMany capable class (NFS, Azure Files, EFS) or an object
  # storage connectionString.
  storageClassName:
  accessModes:
    - ReadWriteMany
  size: 5Gi

cache:
  connectionString:

metrics:
  connectionString:

queue:
  connectionString:

email:
  connectionString:

messagebus:
  connectionString:

otel:
  enabled: true
